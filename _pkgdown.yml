url: https://hugomachadorodrigues.github.io/edaphos

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2ECC71"
    navbar-bg: "#27AE60"
  includes:
    in_header: |
      <!-- SUBRESOURCE INTEGRITY, and a version that cannot move under it.
           This read `mermaid@11` with no integrity attribute: a floating major
           tag, so the bytes the CDN serves change whenever upstream publishes,
           and nothing checked what arrived. SECURITY.md:37 declares this site
           in scope, which makes a third party's ability to change the
           JavaScript on every page a real exposure rather than a theoretical
           one.
           Pinning alone is not enough and integrity alone is impossible: a
           hash cannot be pinned to a tag that moves. Both, or neither.
           The hash is of mermaid 11.16.1 (3,566,058 bytes), computed here from
           the bytes and cross-checked against the same file served by unpkg;
           the two agree. Bumping the version means recomputing it:
             curl -sL https://cdn.jsdelivr.net/npm/mermaid@X.Y.Z/dist/mermaid.min.js |
               openssl dgst -sha384 -binary | openssl base64 -A -->
      <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.min.js"
              integrity="sha384-aBQXj4hK6Jm05i7aQAsUV3bLdSUrHX1BGYfMB0166TtWt/RRaw+h0Eelme9OCOvy"
              crossorigin="anonymous"
              referrerpolicy="no-referrer"></script>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          // pkgdown wraps fenced ```mermaid blocks as
          // <pre><code class="language-mermaid">...</code></pre>.
          // Convert them in-place to <pre class="mermaid"> which
          // mermaid.run() picks up.
          document.querySelectorAll("pre > code.language-mermaid").forEach(function (codeEl) {
            var pre = codeEl.parentElement;
            var div = document.createElement("pre");
            div.className = "mermaid";
            div.textContent = codeEl.textContent;
            pre.replaceWith(div);
          });
          if (window.mermaid) {
            window.mermaid.initialize({ startOnLoad: false, theme: "default" });
            window.mermaid.run();
          }
        });
      </script>
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "edaphos — Digital Soil Mapping with Causal, Physics-Informed and Generative Methods"
    twitter:
      creator: "@Hugo_MRodrigues"
      card: summary_large_image

development:
  mode: auto

home:
  title: edaphos — Frontier algorithms for Digital Soil Mapping
  description: >
    Ten research pillars confronting specific methodological gaps in
    DSM: Causal AI (with LLM-driven KG), Physics-Informed ML, 4D
    Pedometry, Foundation Models, Autonomous Active Learning,
    Quantum ML, Bayesian Hierarchical Spatial models, Neural
    Operators, Diffusion Models, and Graph Attention Networks.
    Unified uncertainty API + cross-pillar bridges.
  links:
  - text: Pedometrics community
    href: https://pedometrics.org
  - text: Zhang & Wadoux (2026) — Causal DSM
    href: https://doi.org/10.1111/ejss.70284

authors:
  Hugo Rodrigues:
    href: https://orcid.org/0000-0002-8070-8126

navbar:
  structure:
    left:  [intro, reference, articles, cheatsheets, news]
    right: [search, github]
  components:
    # The cheatsheets are Markdown in the repository, outside the tarball
    # (.Rbuildignore) and outside what pkgdown renders. This entry links to
    # them on GitHub, which is where cheatsheets/README.md says they live.
    cheatsheets:
      text: Cheatsheets
      href: https://github.com/HugoMachadoRodrigues/edaphos/tree/main/cheatsheets
    # Four entries were removed here in the correctness campaign: they
    # pointed at articles/pillar1-causal-real.html, articles/llm-kg-benchmark.html,
    # articles/pillar3-4d-real.html and articles/pillar5-soilgrids-br.html.
    # Their sources live in a top-level articles/ directory, which pkgdown
    # does not render (it renders vignettes/ and vignettes/articles/), so all
    # four were 404s on the published site.
    articles:
      text: Vignettes
      menu:
      - text: "Capstone — six pillars in one sampling campaign"
      - text: Cross-pillar campaign
        href: articles/capstone-cerrado-campaign.html
      - text: -------
      - text: "Pillar 1 — Causal AI"
      - text: Causal backdoor on br_cerrado
        href: articles/pillar1-causal.html
      - text: Causal-discovery trio (expert × LLM × data-driven)
        href: articles/causal-discovery-trio.html
      - text: Annotation workflow (pre-annotation + Shiny review)
        href: articles/llm-annotation-workflow.html
      - text: -------
      - text: "Pillar 2 — Physics-Informed ML"
      - text: Parametric ODE + Neural ODE
        href: articles/pillar2-piml-profile.html
      - text: -------
      - text: "Pillar 3 — 4D Pedometry"
      - text: ConvLSTM on synthetic cube
        href: articles/pillar3-4d-soc.html
      - text: -------
      - text: "Pillar 4 — Foundation Models"
      - text: SimCLR / MoCo embeddings
        href: articles/pillar4-simclr-embeddings.html
      - text: -------
      - text: "Pillar 5 — Active Learning"
      - text: Hybrid policy + physics gate
        href: articles/pillar5-active-learning.html
      - text: -------
      - text: "Pillar 6 — Quantum ML"
      - text: ZZFeatureMap + Q-KRR
        href: articles/pillar6-quantum.html
      - text: -------
      - text: "Cross-pillar bridges"
      - text: Pillar 1 × Pillar 4 — Foundation IVs
        href: articles/pillar1-pillar4-iv.html
      - text: Pillar 4 × Pillar 6 — Quantum-foundation kernel
        href: articles/pillar4-pillar6-quantum.html
      - text: -------
      - text: "Unified infrastructure"
      - text: Unified uncertainty API
        href: articles/uncertainty-unified.html
      - text: Case — end-to-end Cerrado benchmark
        href: articles/case-cerrado-end-to-end.html

reference:
- title: "Pillar 1 — Causal AI"
  desc: "Backdoor adjustment, LLM-driven Knowledge Graphs, causal discovery, effect posteriors."
  contents:
  - has_concept("pillar1")
  - starts_with("causal_")
  - starts_with("llm_annotation_")
  - starts_with("llm_benchmark_")
  - starts_with("llm_preannotate")
  - summary.edaphos_causal_kg

- title: "Pillar 2 — Physics-Informed ML"
  desc: "Pedogenetic ODE, Bayesian posterior, Neural ODE + ensemble."
  contents:
  - starts_with("piml_")
  - predict.edaphos_piml_bayes
  - predict.edaphos_piml_neural_ode_ensemble

- title: "Pillar 3 — 4D Pedometry"
  desc: "ConvLSTM, rollout, mass-balance physics loss, stochastic EnKF."
  contents:
  - starts_with("temporal_")

- title: "Pillar 4 — Foundation Models"
  desc: "SimCLR + MoCo v2 pretraining, Zenodo-hosted weights, raster extraction."
  contents:
  - starts_with("foundation_")
  - predict.edaphos_foundation_classifier
  - predict.edaphos_foundation_regressor
  - predict.edaphos_foundation_ensemble

- title: "Pillar 5 — Active Learning"
  desc: "Hybrid policy, BatchBALD, physics gate, posterior calibration."
  contents:
  - starts_with("al_")
  - starts_with("active_")

- title: "Pillar 6 — Quantum ML"
  desc: "ZZFeatureMap, Quantum KRR, Qiskit VQE, organo-mineral Hamiltonians."
  contents:
  - starts_with("quantum_")

- title: "Pillar 7 — Bayesian Hierarchical Spatial"
  desc: "Gaussian process + Gibbs sampler (R fast-path / RcppArmadillo / spBayes; the spBayes backend fits but cannot predict)."
  contents:
  - starts_with("bhs_")
  - predict.edaphos_bhs

- title: "Pillar 8 — Neural Operators"
  desc: "DeepONet + FNO over depth function space."
  contents:
  - starts_with("no_")

- title: "Pillar 9 — Diffusion Models"
  desc: "DDPM with cosine schedule + ancestral sampling."
  contents:
  - starts_with("dm_")

- title: "Pillar 10 — Graph Attention Networks"
  desc: "k-NN co-location graphs + multi-head attention, with a sparse attention path."
  contents:
  - starts_with("gnn_")

- title: "Cross-pillar bridges"
  desc: "Foundation embeddings as causal instruments; quantum kernels over foundation embeddings; six further bridges (P7/8/9 x P5 + P10 x P1 + P2 x P3 + P6 x P10)."
  contents:
  - starts_with("qf_")
  - starts_with("al_query_")
  - gnn_causal_discovery
  - temporal_piml_loss

- title: "Unified uncertainty API (v1.6.0)"
  desc: "Common edaphos_posterior class + single calibration diagnostic."
  contents:
  - starts_with("uncertainty_")
  - edaphos_posterior
  - as_edaphos_posterior
  - autoplot.edaphos_posterior
  - starts_with("edaphos_")

- title: "Benchmark wrappers"
  desc: "Plug-and-play wrappers for the 6-pillar WoSIS Cerrado benchmark."
  contents:
  - starts_with("benchmark_fit_")
  # spatial_block_folds was exported without being indexed, which aborts
  # pkgdown's reference build outright -- so the site could not be built at
  # all while a checklist claimed "pkgdown builds cleanly locally".
  - spatial_block_folds

- title: "LLM-KG production pipeline"
  desc: "Resumable 10k+ abstract orchestrator + Ollama pre-flight."
  contents:
  - starts_with("llm_kg_")

- title: "Bundled datasets"
  contents:
  - br_cerrado
  - br_amazon
  - br_pantanal

- title: "Package roadmap"
  contents:
  - edaphos-roadmap

