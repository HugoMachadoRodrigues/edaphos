# Spell check and URL check -- the two gates CONTRIBUTING.md tells contributors
# to run, made to actually run.
#
# WHY THIS FILE EXISTS. CONTRIBUTING.md:46-47 instructs contributors to run
# `devtools::spell_check()` and `urlchecker::url_check()`, and
# .github/PULL_REQUEST_TEMPLATE.md:25 asks them to tick a box saying the first
# is clean. Neither ran anywhere. A gate that lives only in prose is a request,
# not a gate, and the box was ticked on trust.
#
# NOT INCLUDED: a lint job. The finding that prompted this file listed lint
# alongside the other two, but nothing in this repository promises it -- no
# .lintr, no mention in CONTRIBUTING or any template. Adding one would be new
# policy on a 30,000-line package, not the closing of a gap, so it is left to
# a deliberate decision rather than smuggled in here.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: quality-gates

permissions:
  contents: read

jobs:
  spelling:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling

      # ENGLISH SURFACES ONLY, and that is a real constraint rather than a
      # convenience. The vignettes are written in Portuguese; running an en_US
      # dictionary over them reports 375 unknown words, essentially all of them
      # correct Portuguese. That is why this gate was never wired up. Checking
      # man/, README, NEWS and DESCRIPTION -- the English surfaces -- gives a
      # gate that can be clean and therefore means something when it is not.
      #
      # inst/WORDLIST carries the proper nouns, package names, British
      # spellings and technical terms. It was reviewed word by word when this
      # job was added: a WORDLIST that whitelists a genuine typo is worse than
      # no WORDLIST, so the 152 entries added then were each read rather than
      # bulk-accepted.
      - name: Spell check (English surfaces)
        run: |
          wl <- if (file.exists("inst/WORDLIST"))
            readLines("inst/WORDLIST", warn = FALSE) else character()
          files <- c(list.files("man", "[.]Rd$", full.names = TRUE),
                     "README.md", "NEWS.md", "DESCRIPTION")
          files <- files[file.exists(files)]
          r <- spelling::spell_check_files(files, ignore = wl, lang = "en_US")
          if (nrow(r)) {
            print(r)
            stop(sprintf("%d unknown words. Fix the typo, or add the word to inst/WORDLIST if it is one.",
                         nrow(r)))
          }
          cat("spell check clean across", length(files), "files\n")
        shell: Rscript {0}

  urls:
    runs-on: ubuntu-latest
    # ADVISORY, NOT BLOCKING, and for a reason worth stating. urlchecker
    # reports 403 for every doi.org link and for researchgate.net: those hosts
    # refuse programmatic requests without a browser user agent. The links are
    # not broken. A gate that fails on correct DOIs gets switched off within a
    # week, so this one reports and does not block; a genuine 404 still shows
    # up in the log, which is what the check is for.
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::urlchecker

      - name: URL check (advisory)
        # fail = FALSE IS LOAD-BEARING. urlchecker 2.x defaults url_check() to
        # fail = TRUE, which prints the problems and stops on the first call,
        # so the classification below never ran: every slow host turned this
        # job red. Four PRs in a row went red on timeouts alone -- NeurIPS,
        # agrovoc.fao.org, zenodo.org -- each of which answered 200 from a
        # laptop. A check that is red every time stops meaning anything.
        #
        # Now three kinds of problem are told apart, and only one fails:
        #   * bot-blocked hosts (doi.org, researchgate, sciencedirect) refuse
        #     programmatic requests -- listed, not failed;
        #   * timeouts ("Timeout was reached", 5 s) are slow hosts or a slow
        #     runner -- listed, not failed;
        #   * everything else -- a 404, a 410, a refused connection -- is a
        #     link that is actually broken, and fails the job.
        run: |
          r <- urlchecker::url_check(".", progress = FALSE, fail = FALSE)
          if (!NROW(r)) {
            cat("every URL resolved\n")
            quit(status = 0)
          }
          tab <- data.frame(
            URL     = r$URL,
            Status  = r$Status,
            Message = r$Message,
            From    = vapply(r$From, paste, "", collapse = ", "),
            stringsAsFactors = FALSE)
          blocked <- grepl("doi[.]org|researchgate[.]net|sciencedirect",
                           tab$URL, ignore.case = TRUE)
          timeout <- !blocked & grepl("Timeout was reached", tab$Message,
                                      fixed = TRUE)
          broken  <- !blocked & !timeout
          show <- function(title, i) if (any(i)) {
            cat(sprintf("\n--- %s (%d) ---\n", title, sum(i)))
            print(tab[i, ], row.names = FALSE, right = FALSE)
          }
          show("blocked by the host, not broken", blocked)
          show("timed out -- slow host or runner, not counted as broken", timeout)
          show("BROKEN", broken)
          if (any(broken))
            stop(sprintf("%d broken URL%s.", sum(broken),
                         if (sum(broken) > 1) "s" else ""), call. = FALSE)
          cat("\nno broken URLs\n")
        shell: Rscript {0}
